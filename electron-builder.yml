# Linux packages for Dunder: `npm run dist` writes them to release/.
appId: ai.dunder.app
productName: Dunder
copyright: Copyright © 2026 Jeremy Stover
directories:
  output: release
  buildResources: build
# The app root must stay a real directory: agents get `<appRoot>/bin` on PATH,
# office-say runs `src/cli/*.mts` with node, and briefs are read from docs/agents.
asar: false
npmRebuild: false
files:
  - package.json
  - out/**/*
  - bin/**/*
  - src/cli/**/*
  - docs/agents/**/*
  - "!**/*.map"
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  executableName: dunder
  icon: build/icon.png
  category: Development
  synopsis: A 3D office where your AI coding agents work
  maintainer: Jeremy Stover <jeremy.ryan.stover@gmail.com>
  vendor: dunder.ai
  desktop:
    entry:
      Name: Dunder
      StartupWMClass: Dunder
      Keywords: agents;ai;herdr;office;
appImage:
  artifactName: Dunder-${version}-linux-x86_64.${ext}
deb:
  artifactName: dunder_${version}_amd64.${ext}
publish: null
