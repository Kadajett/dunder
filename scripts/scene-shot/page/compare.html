<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Dunder vs reference</title>
		<style>
			body {
				margin: 0;
				padding: 24px;
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 24px;
				background: #f3efe7;
				font: 600 18px/1.3 Inter, system-ui, sans-serif;
				color: #2c3036;
			}
			figure {
				margin: 0;
			}
			figcaption {
				margin-bottom: 10px;
			}
			img {
				display: block;
				width: 100%;
				border-radius: 8px;
				box-shadow: 0 2px 10px rgb(0 0 0 / 0.12);
			}
		</style>
	</head>
	<body>
		<figure>
			<figcaption>Dunder: npm run scene:shot (default layout, no HUD)</figcaption>
			<img id="office" alt="Dunder office scene" />
		</figure>
		<figure>
			<figcaption>Reference: docs/reference/orpex-office.png</figcaption>
			<img id="reference" alt="Reference office" />
		</figure>
		<script type="module" src="./compare.ts"></script>
	</body>
</html>
